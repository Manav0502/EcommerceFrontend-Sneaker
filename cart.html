<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike Store - Shopping Cart</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Main Stylesheet & Script -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Header Navigation Bar -->
    <header class="main-header">
        <nav class="navbar">
            <div class="nav-logo">
                <a href="index.html" class="logo-link">
                    <i class="fa-solid fa-shoe-prints logo-icon"></i>
                    <span class="logo-text">Nike <span class="logo-highlight">Store</span></span>
                </a>
            </div>

            <div class="nav-menu-wrapper">
                <ul class="nav-menu">
                    <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="product.html" class="nav-link">Products</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Brands</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">More</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>
                </ul>
            </div>

            <div class="nav-actions">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" placeholder="Search..." class="search-input">
                </div>
                <a href="cart.html" class="icon-btn cart-btn" aria-label="Shopping Cart">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="cart-badge">0</span>
                </a>
                <div class="profile-avatar">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="User Profile" class="avatar-img">
                </div>
                <button class="mobile-nav-toggle" aria-label="Toggle navigation">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </nav>
    </header>

    <main class="cart-page-main">
        <div class="cart-container">
            
            <h1 class="cart-heading">Shopping Cart</h1>

            <div class="cart-layout">
                
                <div class="cart-left-col">
                    <div class="cart-table-wrapper">
                        <table class="cart-table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Quantity</th>
                                    <th>Price</th>
                                    <th>Remove</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Rendered dynamically by script.js -->
                            </tbody>
                        </table>
                    </div>

                    <div class="continue-shopping-box">
                        <a href="product.html" class="continue-link">
                            <i class="fa-solid fa-chevron-left"></i> Continue Shopping
                        </a>
                    </div>
                </div>

                <div class="cart-right-col">
                    <div class="summary-card">
                        
                        <div class="coupon-box">
                            <label for="couponCode" class="coupon-label">Enter Coupon Code</label>
                            <div class="coupon-input-group">
                                <input type="text" id="couponCode" placeholder="Try NIKE10" class="coupon-input">
                                <button class="btn-apply-coupon">Apply Coupon</button>
                            </div>
                        </div>

                        <div class="summary-details">
                            <div class="summary-row">
                                <span>Sub Total</span>
                                <span class="summary-val summary-subtotal">₹ 0</span>
                            </div>
                            <div class="summary-row">
                                <span>Taxes (18% GST)</span>
                                <span class="summary-val summary-tax">₹ 0</span>
                            </div>
                            <div class="summary-row discount-row">
                                <span>Discount</span>
                                <span class="summary-val summary-discount">- ₹ 0</span>
                            </div>
                            <hr class="summary-divider">
                            <div class="summary-row total-row">
                                <span>Total</span>
                                <span class="total-val">₹ 0</span>
                            </div>
                        </div>

                        <a href="payment.html" class="btn-pay-now">
                            Pay Now <span class="pay-now-amount">₹ 0</span>
                        </a>

                        <div class="trust-badge-container">
                            <div class="secured-tag">
                                <i class="fa-solid fa-shield-halved"></i>
                                <span>100% Secure Checkout</span>
                            </div>
                            <div class="razorpay-badge-box">
                                <i class="fa-solid fa-lock"></i>
                                <span class="razorpay-text">Powered by <strong>Razorpay</strong></span>
                            </div>
                        </div>

                    </div>
                </div>

            </div>

        </div>
    </main>

</body>
</html>
