<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike Store - Checkout & Payment</title>

    <!-- Font Awesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Stylesheet & Vanilla JS -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Header Navigation Bar -->
    <header class="main-header">
        <nav class="navbar">
            <div class="nav-logo">
                <a href="index.html" class="logo-link">
                    <i class="fa-solid fa-shoe-prints logo-icon"></i>
                    <span class="logo-text">Nike <span class="logo-highlight">Store</span></span>
                </a>
            </div>

            <div class="nav-menu-wrapper">
                <ul class="nav-menu">
                    <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="product.html" class="nav-link">Products</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Brands</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">More</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>
                </ul>
            </div>

            <div class="nav-actions">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" placeholder="Search..." class="search-input">
                </div>
                <a href="cart.html" class="icon-btn cart-btn" aria-label="Shopping Cart">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span class="cart-badge">0</span>
                </a>
                <div class="profile-avatar">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="User Profile" class="avatar-img">
                </div>
                <button class="mobile-nav-toggle" aria-label="Toggle navigation">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </nav>
    </header>

    <main class="payment-page-main">
        <div class="payment-container">
            
            <h1 class="checkout-title">Checkout</h1>

            <div class="payment-layout">
                
                <div class="payment-left-col">
                    
                    <div class="checkout-card">
                        <h2 class="card-title"><i class="fa-solid fa-envelope" style="color:var(--primary-red);"></i> Contact Details</h2>
                        <div class="form-group">
                            <label for="customerEmail" class="form-label">Email Address *</label>
                            <input type="email" id="customerEmail" placeholder="customer@example.com" class="form-input">
                            <small class="error-text" id="emailError"></small>
                        </div>
                    </div>

                    <div class="checkout-card">
                        <h2 class="card-title"><i class="fa-solid fa-credit-card" style="color:var(--primary-red);"></i> Payment Method</h2>
                        
                        <div class="payment-methods-tabs">
                            <button class="method-tab active" data-method="cards">
                                <i class="fa-solid fa-credit-card"></i>
                                <span>Cards</span>
                            </button>
                            <button class="method-tab" data-method="crypto">
                                <i class="fa-brands fa-bitcoin"></i>
                                <span>Crypto</span>
                            </button>
                            <button class="method-tab" data-method="bank">
                                <i class="fa-solid fa-building-columns"></i>
                                <span>Bank</span>
                            </button>
                            <button class="method-tab" data-method="upi">
                                <i class="fa-solid fa-mobile-screen-button"></i>
                                <span>UPI</span>
                            </button>
                        </div>

                        <!-- PANEL 1: CARDS -->
                        <div class="payment-panel active-panel" id="panel-cards">
                            <div class="form-group">
                                <label for="cardNumber" class="form-label">Card Number (16 Digits) *</label>
                                <input type="text" id="cardNumber" placeholder="1234 5678 9101 1121" maxlength="19" class="form-input">
                                <small class="error-text" id="cardError"></small>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="cardExpiry" class="form-label">Expiry (MM/YY) *</label>
                                    <input type="text" id="cardExpiry" placeholder="MM/YY" maxlength="5" class="form-input">
                                    <small class="error-text" id="expError"></small>
                                </div>
                                <div class="form-group">
                                    <label for="cardCvv" class="form-label">CVV (3 Digits) *</label>
                                    <input type="password" id="cardCvv" placeholder="123" maxlength="3" class="form-input">
                                    <small class="error-text" id="cvvError"></small>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label for="cardCountry" class="form-label">Country</label>
                                    <select id="cardCountry" class="form-input select-input">
                                        <option value="India" selected>India</option>
                                        <option value="United States">United States</option>
                                        <option value="United Kingdom">United Kingdom</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="cardZip" class="form-label">Zip Code (6 Digits) *</label>
                                    <input type="text" id="cardZip" placeholder="110001" maxlength="6" class="form-input">
                                    <small class="error-text" id="zipError"></small>
                                </div>
                            </div>
                        </div>

                        <!-- PANEL 2: CRYPTO -->
                        <div class="payment-panel" id="panel-crypto">
                            <div style="background:var(--soft-bg); border:1px dashed var(--primary-red); padding:0.8rem; border-radius:6px; margin-bottom:1rem; font-size:0.85rem;">
                                <strong>Store Wallet Address:</strong> <code style="word-break:break-all;">0x71C7656EC7ab88b098defB751B7401B5f6d8976F</code>
                            </div>

                            <div class="form-group">
                                <label for="cryptoSelect" class="form-label">Select Cryptocurrency *</label>
                                <select id="cryptoSelect" class="form-input select-input">
                                    <option value="" disabled selected>Choose Crypto...</option>
                                    <option value="BTC">Bitcoin (BTC)</option>
                                    <option value="ETH">Ethereum (ETH)</option>
                                    <option value="USDT">Tether (USDT)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="cryptoTxInput" class="form-label">TxID / Wallet Address *</label>
                                <input type="text" id="cryptoTxInput" placeholder="Enter transaction hash or wallet ID" class="form-input">
                                <small class="error-text" id="cryptoError"></small>
                            </div>
                        </div>

                        <!-- PANEL 3: BANK / NET BANKING -->
                        <div class="payment-panel" id="panel-bank">
                            <div class="form-group">
                                <label for="bankSelect" class="form-label">Select Bank *</label>
                                <select id="bankSelect" class="form-input select-input">
                                    <option value="" disabled selected>Choose Bank...</option>
                                    <option value="sbi">State Bank of India (SBI)</option>
                                    <option value="hdfc">HDFC Bank</option>
                                    <option value="icici">ICICI Bank</option>
                                    <option value="axis">Axis Bank</option>
                                    <option value="other">Other Bank...</option>
                                </select>
                            </div>

                            <div class="form-group" id="otherBankGroup" style="display: none;">
                                <label for="otherBankName" class="form-label">Enter Bank Name *</label>
                                <input type="text" id="otherBankName" placeholder="Type your bank name" class="form-input">
                                <small class="error-text" id="bankError"></small>
                            </div>
                        </div>

                        <!-- PANEL 4: UPI -->
                        <div class="payment-panel" id="panel-upi">
                            <div class="form-group">
                                <label for="upiIdInput" class="form-label">UPI ID (Virtual Payment Address) *</label>
                                <input type="text" id="upiIdInput" placeholder="username@upi or mobile@paytm" class="form-input">
                                <small class="error-text" id="upiError"></small>
                            </div>
                        </div>

                    </div>

                </div>

                <div class="payment-right-col">
                    <div class="summary-card">
                        <h2 class="card-title">Order Summary</h2>

                        <div class="summary-details">
                            <div class="summary-row">
                                <span>Sub Total</span>
                                <span class="summary-subtotal" style="font-weight:600; color:var(--text-color);">₹ 0</span>
                            </div>
                            <div class="summary-row">
                                <span>Taxes (18% GST)</span>
                                <span class="summary-tax" style="font-weight:600; color:var(--text-color);">₹ 0</span>
                            </div>
                            <div class="summary-row" style="color:var(--primary-red);">
                                <span>Discount</span>
                                <span class="summary-discount" style="font-weight:600;">- ₹ 0</span>
                            </div>
                            <hr style="border:0; height:1px; background:var(--border-color); margin:0.3rem 0;">
                            <div class="summary-row total-row">
                                <span>Total</span>
                                <span class="total-val">₹ 0</span>
                            </div>
                        </div>

                        <button type="button" id="payNowBtn" class="btn-pay-now" disabled>
                            Pay Now <span class="pay-now-amount">₹ 0</span>
                        </button>

                        <div style="text-align:center; margin-top:1rem; font-size:0.8rem; color:var(--text-muted);">
                            <i class="fa-solid fa-shield-halved" style="color:var(--success-green);"></i> 100% Secure Gateway Simulation
                        </div>

                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- Simulated Payment Gateway Modal -->
    <div class="modal-overlay" id="paymentModal">
        <div class="modal-box">
            <div id="modalContent">
                <!-- Injected dynamically by script.js -->
            </div>
        </div>
    </div>

</body>
</html>
